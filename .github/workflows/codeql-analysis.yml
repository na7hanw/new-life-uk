name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Also write the SARIF to disk so the findings can be read from the
          # run itself. The check run summary reports only a severity count, and
          # the alert detail lives behind the Security tab, which needs
          # authenticated access — so a failure was not diagnosable from the run
          # alone. Uploading to the code-scanning API still happens as before.
          output: sarif-results

      # Print the findings into the job log. The artifact above is only
      # readable by someone who can download it; the log is readable by anyone
      # looking at the failed run, which is the point — a check that can only
      # say "1 high" to the person trying to fix it gets ignored.
      - name: Print CodeQL findings
        if: always()
        run: |
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SARIF produced."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "=== $f ==="
            jq -r '
              .runs[]
              | (.tool.driver.rules // []) as $rules
              | .results[]?
              | . as $r
              | ($rules[($r.rule.index // -1)] // {}) as $rule
              | [
                  ($r.ruleId // "?"),
                  ($rule.properties["security-severity"] // $r.level // "?"),
                  ($r.locations[0].physicalLocation.artifactLocation.uri // "?"),
                  ($r.locations[0].physicalLocation.region.startLine // "?"),
                  ($r.message.text // "" | gsub("\n"; " "))
                ]
              | @tsv
            ' "$f" || echo "(could not parse $f)"
          done

      - name: Upload SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 7
