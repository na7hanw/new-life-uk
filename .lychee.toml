# Lychee broken link checker config
# Patterns to skip entirely (local/relative paths and non-HTTP schemes)
exclude = [
  "localhost",
  "127.0.0.1",
  "0.0.0.0",
  "example.com",
  "^mailto:",
  "^tel:",
  "^/#",
  "^/[^/]",
  # Facebook and LinkedIn actively block bots — skip to avoid false positives
  "facebook\\.com",
  "linkedin\\.com",
  # Apple App Store returns 403 to bots
  "apps\\.apple\\.com",
  # Employer job boards that time out or reset for CI runners AND from a
  # sandboxed check, so their liveness could NOT be confirmed either way. They
  # are excluded because a timeout is not evidence of a dead link, not because
  # they are known good — each needs a manual check from an ordinary browser.
  "travelodgejobs\\.co\\.uk",
  "driver\\.olacabs\\.com",
  "easyid\\.com",
  "jobs\\.careuk\\.com",
  "jobs\\.greggs\\.co\\.uk",
  "capitatranslationinterpreting\\.com",
  "jobskilla\\.com",
  # Same category: these reset the connection for the CI runner. Also
  # unreachable from a sandboxed check, so liveness is UNCONFIRMED either way.
  "careers\\.premierinn\\.com",
  "jobs\\.pret\\.com",
  "jobs\\.sainsburys\\.co\\.uk",
  "careers\\.lidl\\.co\\.uk",
  "nrinorfolk\\.co\\.uk",
  # Bot defences that return something other than an HTTP status a checker can
  # use. g4s.com answers "247", which is not a real status code; caterer.com and
  # gamcare.org.uk break the HTTP/2 stream mid-response. All three reproduce
  # identically from CI and from a separate network, so this is server-side
  # behaviour towards non-browser clients rather than a dead page.
  "g4s\\.com",
  "caterer\\.com",
  "gamcare\\.org\\.uk",
  "ubereats\\.com",
  # Incomplete TLS chains: both serve a certificate without the intermediate, so
  # strict clients (lychee's rustls, and curl on a separate network) reject them
  # while browsers usually recover via AIA fetching. A server misconfiguration on
  # their side, not a broken link — but it means neither could be content-checked.
  "nrpsi\\.org\\.uk",
  "teachvac\\.co\\.uk",
  # Verified HTTP 200 by hand on 29 Aug 2026, but resets the connection for the
  # CI runner specifically.
  "nocn\\.org\\.uk",
  # Rate-limits automated checks: 503 in CI, 429 by hand on the same day.
  "numbeo\\.com",
  # Intermittent: both answered by hand on 29 Aug 2026 and both passed one CI
  # run after the timeout was raised to 40s, then timed out on the next. They
  # are slow and inconsistent rather than dead, and a check that fails at random
  # teaches people to ignore it.
  "bii\\.org",
  "maternityaction\\.org\\.uk",
]

# Accept 200 + all standard redirects as valid.
# 403 is included because GOV.UK and some large sites rate-limit or block
# headless checks from CI runners with a 403 even though the link is live.
# 406 is included because Uber answers "Not Acceptable" to non-browser user
# agents; the pages resolve normally in a real browser.
# 202 is a success response — Refuge Action and Maternity Action return it.
accept = [200, 202, 206, 301, 302, 307, 308, 403, 406, 429]

# Timeout per request in seconds. Raised from 25: bii.org and
# maternityaction.org.uk both answered within a hand-run check but exceeded 25s
# from the CI runner. They are slow, not dead, so give them room rather than
# excluding them.
timeout = 40

# Max retries per link (with exponential back-off)
max_retries = 3

# Pretend to be a real browser so GOV.UK and NHS don't bot-block us
user_agent = "Mozilla/5.0 (compatible; New-Life-UK-LinkChecker/1.0)"
